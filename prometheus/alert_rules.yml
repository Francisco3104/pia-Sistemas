groups:
  - name: sistema
    rules:

      - alert: highCPU
        expr: 100 - (avg by(instance) (rate(node_cpu_seconds_total{mode="idle"}[2m])) * 100) > 85
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "CPU alto en {{ $labels.instance }}"
          description: "CPU al {{ $value | printf \"%.1f\" }}% por más de 2 minutos."

      - alert: lowMemory
        expr: (node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes) * 100 < 10
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "Memoria critica en {{ $labels.instance }}"
          description: "Solo {{ $value | printf \"%.1f\" }}% de RAM disponible."

      - alert: fullDisk
        expr: (node_filesystem_size_bytes{fstype!="tmpfs"} - node_filesystem_free_bytes{fstype!="tmpfs"}) / node_filesystem_size_bytes{fstype!="tmpfs"} * 100 > 85
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Disco lleno en {{ $labels.instance }}"
          description: "Particion {{ $labels.mountpoint }} al {{ $value | printf \"%.1f\" }}%."

      - alert: hostDown
        expr: up == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "Host caido: {{ $labels.instance }}"
          description: "No se reciben métricas de {{ $labels.job }}."
